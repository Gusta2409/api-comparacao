name: comparador-precos
services:
  banco-dados:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SENHA_SQLSERVER:?Defina SENHA_SQLSERVER no ambiente ou no arquivo .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - dados-sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  preparar-banco:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      banco-dados:
        condition: service_healthy
    environment:
      SENHA_SQLSERVER: ${SENHA_SQLSERVER:?Defina SENHA_SQLSERVER no ambiente ou no arquivo .env}
    entrypoint: /bin/bash
    command:
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -S banco-dados -U sa -P "$$SENHA_SQLSERVER" -C -Q "IF DB_ID('COMPARADOR_PRECO') IS NULL CREATE DATABASE COMPARADOR_PRECO" -b
  mensageria:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:29092,EXTERNO://:9092,CONTROLADOR://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://mensageria:29092,EXTERNO://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT,CONTROLADOR:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLADOR
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@mensageria:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
  painel-kafka:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      mensageria:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: ambiente-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: mensageria:29092
volumes:
  dados-sqlserver:
